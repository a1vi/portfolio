<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bracuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003087;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bracuAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#bracuGrad)"/>
  <!-- Decorative top stripe -->
  <rect x="0" y="0" width="100" height="6" rx="14" fill="url(#bracuAccent)"/>
  <rect x="0" y="6" width="100" height="2" rx="0" fill="#FFD700" opacity="0.3"/>
  <!-- Torch / flame icon -->
  <ellipse cx="50" cy="34" rx="7" ry="9" fill="#FFD700" opacity="0.9"/>
  <polygon points="50,20 46,32 50,28 54,32" fill="#FFA500"/>
  <polygon points="50,24 47,33 50,30 53,33" fill="#FFD700"/>
  <!-- Handle -->
  <rect x="47" y="40" width="6" height="10" rx="2" fill="#FFD700" opacity="0.85"/>
  <!-- BRACU text -->
  <text x="50" y="66" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="1">BRAC</text>
  <!-- Thin divider -->
  <rect x="18" y="70" width="64" height="1.2" rx="1" fill="url(#bracuAccent)" opacity="0.7"/>
  <text x="50" y="82" text-anchor="middle" fill="#9EC8F0" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">UNIVERSITY</text>
</svg>
