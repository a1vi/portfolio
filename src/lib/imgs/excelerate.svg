<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="exGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b7410e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="exAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#exGrad)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="100" height="5" rx="14" fill="url(#exAccent)"/>
  <!-- Rocket / accelerate icon -->
  <!-- Rocket body -->
  <ellipse cx="50" cy="34" rx="8" ry="14" fill="white" opacity="0.25"/>
  <polygon points="50,18 43,32 57,32" fill="white" opacity="0.35"/>
  <!-- Rocket window -->
  <circle cx="50" cy="33" r="4" fill="white" opacity="0.2"/>
  <circle cx="50" cy="33" r="2.5" fill="#FFD700" opacity="0.6"/>
  <!-- Fins -->
  <polygon points="42,42 38,50 45,46" fill="white" opacity="0.3"/>
  <polygon points="58,42 62,50 55,46" fill="white" opacity="0.3"/>
  <!-- Exhaust flame -->
  <ellipse cx="50" cy="51" rx="4" ry="6" fill="#FFD700" opacity="0.7"/>
  <ellipse cx="50" cy="53" rx="2.5" ry="4" fill="white" opacity="0.5"/>
  <!-- EXCELERATE text -->
  <text x="50" y="68" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">EXCELERATE</text>
  <rect x="18" y="71" width="64" height="1.2" rx="1" fill="url(#exAccent)" opacity="0.6"/>
  <text x="50" y="82" text-anchor="middle" fill="rgba(255,220,160,0.9)" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">Internship</text>
  <text x="50" y="92" text-anchor="middle" fill="rgba(255,220,160,0.7)" font-family="Arial,sans-serif" font-size="7">Remote · 2025</text>
</svg>
