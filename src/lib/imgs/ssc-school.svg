<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#145a32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sscAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a9dfbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#sscGrad)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="100" height="5" rx="14" fill="url(#sscAccent)"/>
  <!-- School building icon -->
  <!-- Roof -->
  <polygon points="50,18 27,33 73,33" fill="white" opacity="0.2"/>
  <polygon points="50,20 29,33 71,33" fill="white" opacity="0.15"/>
  <!-- Flag pole -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <polygon points="50,12 57,15 50,18" fill="#a9dfbf" opacity="0.8"/>
  <!-- Building body -->
  <rect x="30" y="33" width="40" height="18" rx="1" fill="white" opacity="0.15"/>
  <!-- Windows -->
  <rect x="34" y="37" width="7" height="8" rx="1" fill="#a9dfbf" opacity="0.5"/>
  <rect x="46" y="37" width="7" height="8" rx="1" fill="#a9dfbf" opacity="0.5"/>
  <rect x="58" y="37" width="7" height="8" rx="1" fill="#a9dfbf" opacity="0.5"/>
  <!-- Door -->
  <rect x="44" y="44" width="11" height="7" rx="1" fill="white" opacity="0.25"/>
  <!-- SSC Text -->
  <text x="50" y="66" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="2">SSC</text>
  <rect x="18" y="70" width="64" height="1.2" rx="1" fill="url(#sscAccent)" opacity="0.6"/>
  <text x="50" y="80" text-anchor="middle" fill="#a9dfbf" font-family="Arial,sans-serif" font-size="7" letter-spacing="0.5">Mograpara HGGS</text>
  <text x="50" y="90" text-anchor="middle" fill="#a9dfbf" font-family="Arial,sans-serif" font-size="7" letter-spacing="0.5">Smrity Biddayoton</text>
</svg>
